<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой любимый герой — Человек-паук</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; margin: 40px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
    h1 { color: #e60000; }
    img { width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Человек-паук (Spider-Man)</h1>
    <img src="https://upload.wikimedia.org/wikipedia/en/0/0c/Spiderman50.jpg" alt="Человек-паук">
    <p><strong>Настоящее имя:</strong> Питер Паркер</p>
    <p>Обычный школьник, укушенный радиоактивным пауком, получил сверхчеловеческие способности. 
       Он борется с преступностью в Нью-Йорке, совмещая жизнь супергероя и обычного человека.</p>
    <p><em>Девиз:</em> «С великой силой приходит великая ответственность».</p>
  </div>
</body>
</html>
